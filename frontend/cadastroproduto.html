</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Almoxerifado</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="cadastroproduto.html">Cadastrar Produto</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="produtos.html">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="movimentacao.html">Movimentação</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="relatorio.html">Relatório</a>

        <li class="nav-item">          <a class="nav-link" href="perfil.html">👤 Meu Perfil</a>
        </li>

        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">

<h2>Novo Produto</h2>

<input
id="nome"
class="form-control mb-2"
placeholder="Nome">

<input
id="quantidade"
type="number"
class="form-control mb-2"
placeholder="Quantidade">

<button
onclick="salvarProduto()"
class="btn btn-success">

Salvar

</button>

<button
onclick="window.location='produtos.html'"
class="btn btn-primary ms-2">

Ver Produtos

</button>

</div>

<script>

async function salvarProduto(){

 try{
   const token =
   localStorage.getItem('token');

   if(!token){
     alert('Erro: Nenhum token encontrado. Faça login novamente!');
     window.location = 'login.html';
     return;
   }

   const nome = document.getElementById('nome').value;
   const quantidade = document.getElementById('quantidade').value;

   if(!nome || !quantidade){
     alert('Por favor, preencha todos os campos!');
     return;
   }

   console.log('Salvando produto:', {nome, quantidade});

   const response =
   await fetch(
   'http://localhost:3000/produtos',
   {
    method:'POST',

    headers:{
     'Content-Type':'application/json',
     authorization:token
    },

    body:JSON.stringify({
     nome,
     quantidade
    })

   });

   console.log('Status da resposta:', response.status);

   const data = await response.json();

   console.log('Dados recebidos:', data);

   if(!response.ok){
     alert('Erro: ' + (data.msg || 'Erro desconhecido'));
     return;
   }

   alert(data.msg || 'Produto cadastrado com sucesso!');
   
   document.getElementById('nome').value = '';
   document.getElementById('quantidade').value = '';

   setTimeout(() => {
     window.location = 'produtos.html';
   }, 1000);

 } catch(err){
   console.error('Erro ao salvar:', err);
   alert('Erro ao salvar produto: ' + err.message);
 }

}

function logout(){
  localStorage.removeItem('token');
  window.location = 'login.html';
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
