<!DOCTYPE html>
<html>

<head>

<title>Relatório de Movimentações</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Almoxerifado</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="cadastroproduto.html">Cadastrar Produto</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="produtos.html">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="movimentacao.html">Movimentação</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="relatorio.html">Relatório</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="perfil.html">👤 Meu Perfil</a>
        </li>
        <li class="nav-item">          <a class="nav-link text-danger" href="#" onclick="logout()">Sair</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">

<h2>Relatório de Movimentações</h2>

<div class="row mb-3">
  <div class="col-md-4">
    <input type="text" id="filtroNome" class="form-control" placeholder="Filtrar por produto...">
  </div>
  <div class="col-md-3">
    <input type="date" id="filtroData" class="form-control">
  </div>
  <div class="col-md-3">
    <select id="filtroTipo" class="form-control">
      <option value="">Todos os tipos</option>
      <option value="ENTRADA">Entrada</option>
      <option value="SAIDA">Saída</option>
    </select>
  </div>
  <div class="col-md-2">
    <button class="btn btn-primary w-100" onclick="aplicarFiltros()">Filtrar</button>
  </div>
  <div class="col-md-2">
    <button class="btn btn-secondary w-100" onclick="limparFiltros()">Limpar</button>
  </div>
  <div class="col-md-2">
    <button class="btn btn-success w-100" onclick="exportarExcel()">📊 Excel</button>
  </div>
</div>

<table class="table table-striped">
<thead>
<tr>
<th>Produto</th>
<th>Tipo</th>
<th>Quantidade</th>
<th>Usuário</th>
<th>Data/Hora</th>
</tr>
</thead>
<tbody id="listaMovimentacoes">
<tr><td colspan="5">Carregando...</td></tr>
</tbody>
</table>

</div>

<script>

async function carregarMovimentacoes(){

 const token = localStorage.getItem('token');

 if(!token){
   alert('Erro: Nenhum token encontrado. Faça login novamente!');
   window.location = 'login.html';
   return;
 }

 try {
   const response = await fetch(
     'http://localhost:3000/produtos/movimentacoes',
     {
       headers: {
         authorization: token
       }
     }
   );

   const movimentacoes = await response.json();

   if(!Array.isArray(movimentacoes)){
     console.error('Erro ao carregar movimentações');
     return;
   }

   window.todasMovimentacoes = movimentacoes;
   mostrarMovimentacoes(movimentacoes);

 } catch(err){
   console.error('Erro:', err);
   alert('Erro ao carregar movimentações: ' + err.message);
 }

}

function mostrarMovimentacoes(movimentacoes){

 const tbody = document.getElementById('listaMovimentacoes');
 tbody.innerHTML = '';

 if(movimentacoes.length === 0){
   tbody.innerHTML = '<tr><td colspan="5">Nenhuma movimentação encontrada</td></tr>';
   return;
 }

 movimentacoes.forEach(m => {
   const data = new Date(m.data_movimentacao);
   const dataFormatada = data.toLocaleDateString('pt-BR') + ' ' + data.toLocaleTimeString('pt-BR');
   
   const tr = document.createElement('tr');
   tr.innerHTML = `
     <td>${m.produto}</td>
     <td><span class="badge ${m.tipo === 'ENTRADA' ? 'bg-success' : 'bg-danger'}">${m.tipo}</span></td>
     <td>${m.quantidade}</td>
     <td>${m.usuario}</td>
     <td>${dataFormatada}</td>
   `;
   tbody.appendChild(tr);
 });

}

function aplicarFiltros(){

 const nome = document.getElementById('filtroNome').value.toLowerCase();
 const data = document.getElementById('filtroData').value;
 const tipo = document.getElementById('filtroTipo').value;

 let movimentacoesFiltradas = window.todasMovimentacoes || [];

 if(nome){
   movimentacoesFiltradas = movimentacoesFiltradas.filter(m => 
     m.produto.toLowerCase().includes(nome)
   );
 }

 if(data){
   movimentacoesFiltradas = movimentacoesFiltradas.filter(m => {
     const dataMov = m.data_movimentacao.split('T')[0]; // Formato YYYY-MM-DD
     return dataMov === data;
   });
 }

 if(tipo){
   movimentacoesFiltradas = movimentacoesFiltradas.filter(m => 
     m.tipo === tipo
   );
 }

 mostrarMovimentacoes(movimentacoesFiltradas);

}

function limparFiltros(){

 document.getElementById('filtroNome').value = '';
 document.getElementById('filtroData').value = '';
 document.getElementById('filtroTipo').value = '';

 mostrarMovimentacoes(window.todasMovimentacoes || []);

}

function logout(){
  localStorage.removeItem('token');
  window.location = 'login.html';
}

function exportarExcel(){
  const tbody = document.getElementById('listaMovimentacoes');
  const linhas = tbody.querySelectorAll('tr');

  if(linhas.length === 0 || linhas[0].cells[0].textContent === 'Nenhuma movimentação encontrada'){
    alert('Nenhuma movimentação para exportar!');
    return;
  }

  let csv = 'Produto,Tipo,Quantidade,Usuário,Data/Hora\n';
  
  linhas.forEach(linha => {
    const produto = linha.cells[0].textContent;
    const tipo = linha.cells[1].textContent.trim();
    const quantidade = linha.cells[2].textContent;
    const usuario = linha.cells[3].textContent;
    const data = linha.cells[4].textContent;
    
    csv += `"${produto}","${tipo}","${quantidade}","${usuario}","${data}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  
  link.setAttribute('href', url);
  link.setAttribute('download', 'relatorio_' + new Date().toISOString().split('T')[0] + '.csv');
  link.style.visibility = 'hidden';
  
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  
  alert('✅ Relatório exportado com sucesso!');
}

window.onload = function(){
  carregarMovimentacoes();
};

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
