<link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container-fluid">
    <a class="navbar-brand" href="#">Almoxerifado</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="cadastroproduto.html">Cadastrar Produto</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="produtos.html">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="movimentacao.html">Movimentação</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="relatorio.html">Relatório</a>
        </li>

          <a class="nav-link" href="perfil.html">👤 Meu Perfil</a>
        </li>

        </li>
      </ul>

</nav>

<div class="container mt-5">

<h2>Relatório de Movimentações</h2>

<div class="row mb-3">
  <div class="col-md-4">
    <input type="text" id="filtroNome" class="form-control" placeholder="Filtrar por produto...">
  </div>
  <div class="col-md-3">
    <input type="date" id="filtroData" class="form-control">
  </div>
  <div class="col-md-3">
    <select id="filtroTipo" class="form-control">
      <option value="">Todos os tipos</option>
      <option value="ENTRADA">Entrada</option>
      <option value="SAIDA">Saída</option>
    </select>
  </div>
  <div class="col-md-2">
    <button class="btn btn-primary w-100" onclick="aplicarFiltros()">Filtrar</button>
  </div>
  <div class="col-md-2">
    <button class="btn btn-secondary w-100" onclick="limparFiltros()">Limpar</button>
  </div>
  <div class="col-md-2">
    <button class="btn btn-success w-100" onclick="exportarExcel()">📊 Excel</button>
  </div>
</div>

<table class="table table-striped">
<thead>
<tr>
<th>Produto</th>
<th>Tipo</th>
<th>Quantidade</th>
<th>Usuário</th>
<th>Data/Hora</th>
</tr>
</thead>
<tbody id="listaMovimentacoes">
<tr><td colspan="5">Carregando...</td></tr>
</tbody>
</table>

</div>

<script>

function getAuthHeader() {
  const token = localStorage.getItem('token');
  if (!token) return null;
  return token.startsWith('Bearer ') ? token : `Bearer ${token}`;
}

function formatarDataHora(dataIso) {
  const data = new Date(dataIso);
  return `${data.toLocaleDateString('pt-BR')} ${data.toLocaleTimeString('pt-BR')}`;
}

async function carregarMovimentacoes(){
  const token = getAuthHeader();

  if(!token){
    alert('Erro: Nenhum token encontrado. Faça login novamente!');
    window.location = 'login.html';
    return;
  }

  const produto = document.getElementById('filtroNome').value.trim();
  const data = document.getElementById('filtroData').value;
  const tipo = document.getElementById('filtroTipo').value;

  const params = new URLSearchParams();
  if (produto) params.set('produto', produto);
  if (data) params.set('data', data);
  if (tipo) params.set('tipo', tipo);

  try {
    const response = await fetch(
      `http://localhost:3000/produtos/movimentacoes?${params.toString()}`,
      {
        headers: {
          authorization: token
        }
      }
    );

    if (!response.ok) {
      const erro = await response.json().catch(() => ({}));
      throw new Error(erro.msg || 'Falha ao carregar movimentações');
    }

    const movimentacoes = await response.json();

    if(!Array.isArray(movimentacoes)){
      throw new Error('Resposta inválida da API');
    }

    window.todasMovimentacoes = movimentacoes;
    window.movimentacoesFiltradas = movimentacoes;
    mostrarMovimentacoes(movimentacoes);

  } catch(err){
    console.error('Erro:', err);
    alert('Erro ao carregar movimentações: ' + err.message);
  }

}

function mostrarMovimentacoes(movimentacoes){
  const tbody = document.getElementById('listaMovimentacoes');
  tbody.innerHTML = '';

  if(!Array.isArray(movimentacoes) || movimentacoes.length === 0){
    tbody.innerHTML = '<tr><td colspan="5">Nenhuma movimentação encontrada</td></tr>';
    return;
  }

  movimentacoes.forEach(m => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${m.produto || ''}</td>
      <td><span class="badge ${m.tipo === 'ENTRADA' ? 'bg-success' : 'bg-danger'}">${m.tipo || ''}</span></td>
      <td>${m.quantidade ?? 0}</td>
      <td>${m.usuario || ''}</td>
      <td>${formatarDataHora(m.data_movimentacao)}</td>
    `;
    tbody.appendChild(tr);
  });

  window.movimentacoesFiltradas = movimentacoes;
}

function aplicarFiltros(){
  const nome = document.getElementById('filtroNome').value.trim().toLowerCase();
  const data = document.getElementById('filtroData').value;
  const tipo = document.getElementById('filtroTipo').value;

  carregarMovimentacoes();
}

function limparFiltros(){
  document.getElementById('filtroNome').value = '';
  document.getElementById('filtroData').value = '';
  document.getElementById('filtroTipo').value = '';

  carregarMovimentacoes();
}

function logout(){
  localStorage.removeItem('token');
  window.location = 'login.html';
}

function exportarExcel(){
  const dados = Array.isArray(window.movimentacoesFiltradas) && window.movimentacoesFiltradas.length
    ? window.movimentacoesFiltradas
    : (Array.isArray(window.todasMovimentacoes) ? window.todasMovimentacoes : []);

  if (dados.length === 0) {
    alert('Nenhuma movimentação para exportar!');
    return;
  }

  const linhas = dados.map(m => [
    String(m.produto || '').replaceAll('"', '""'),
    String(m.tipo || '').replaceAll('"', '""'),
    String(m.quantidade ?? ''),
    String(m.usuario || '').replaceAll('"', '""'),
    formatarDataHora(m.data_movimentacao)
  ]);

  const csv = [
    'Produto,Tipo,Quantidade,Usuário,Data/Hora',
    ...linhas.map(linha => linha.map(valor => `"${valor}"`).join(','))
  ].join('\n');

  const bom = '\uFEFF';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);

  link.href = url;
  link.download = `relatorio_${new Date().toISOString().slice(0, 10)}.csv`;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  alert('✅ Relatório exportado com sucesso!');
}

window.onload = function(){
  carregarMovimentacoes();
};

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
