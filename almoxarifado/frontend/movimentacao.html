<!DOCTYPE html>
<html>

<head>

<title>Movimentação</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Almoxerifado</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="cadastroproduto.html">Cadastrar Produto</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="produtos.html">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="movimentacao.html">Movimentação</a>
        </li>
        <li class="nav-item">          <a class="nav-link" href="relatorio.html">Relatório</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-danger" href="#" onclick="logout()">Sair</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">

<h2>Movimentação</h2>

<div class="row">
  <div class="col-md-6">
    <input
    id="produto"
    type="number"
    class="form-control mb-2"
    placeholder="ID Produto"
    onchange="verificarProduto()">

    <div id="info-produto" style="display:none;" class="alert alert-info mb-3">
      <strong>Produto:</strong> <span id="nome-produto"></span><br>
      <strong>Quantidade em estoque:</strong> <span id="qtd-disponivel"></span>
    </div>

    <select
    id="tipo"
    class="form-control mb-2">

    <option value="ENTRADA">
    Entrada
    </option>

    <option value="SAIDA">
    Saída
    </option>

    </select>

    <input
    id="quantidade"
    type="number"
    class="form-control mb-2"
    placeholder="Quantidade"
    onchange="validarQuantidade()">

    <div id="aviso-estoque" style="display:none;" class="alert alert-danger mb-2"></div>

    <button
    id="btn-movimentar"
    onclick="movimentar()"
    class="btn btn-primary w-100">

    Movimentar

    </button>
  </div>
</div>

</div>

<script>

let produtoAtual = null;

async function verificarProduto(){

 const produtoId = parseInt(document.getElementById('produto').value);

 if(!produtoId){
   document.getElementById('info-produto').style.display = 'none';
   return;
 }

 const token = localStorage.getItem('token');

 try {
   const response = await fetch(
     'http://localhost:3000/produtos',
     {
       headers: {
         authorization: token
       }
     }
   );

   const produtos = await response.json();
   const produto = produtos.find(p => p.id === produtoId);

   if(!produto){
     alert('Produto não encontrado!');
     document.getElementById('info-produto').style.display = 'none';
     return;
   }

   produtoAtual = produto;
   document.getElementById('nome-produto').textContent = produto.nome;
   document.getElementById('qtd-disponivel').textContent = produto.quantidade;
   document.getElementById('info-produto').style.display = 'block';

 } catch(err){
   console.error('Erro:', err);
   alert('Erro ao verificar produto: ' + err.message);
 }

}

function validarQuantidade(){

 const quantidade = parseInt(document.getElementById('quantidade').value);
 const tipo = document.getElementById('tipo').value;
 const aviso = document.getElementById('aviso-estoque');
 const btn = document.getElementById('btn-movimentar');

 aviso.style.display = 'none';
 btn.disabled = false;

 if(!produtoAtual){
   return;
 }

 if(tipo === 'SAIDA' && quantidade > produtoAtual.quantidade){
   aviso.textContent = `❌ Estoque insuficiente! Disponível: ${produtoAtual.quantidade}`;
   aviso.style.display = 'block';
   btn.disabled = true;
 }

}

async function movimentar(){

 const token = localStorage.getItem('token');

 const produtoId = parseInt(document.getElementById('produto').value);
 const tipo = document.getElementById('tipo').value;
 const quantidade = parseInt(document.getElementById('quantidade').value);

 if(!produtoId || !tipo || !quantidade){
   alert('Por favor, preencha todos os campos!');
   return;
 }

 if(!produtoAtual){
   alert('Produto não encontrado!');
   return;
 }

 if(tipo === 'SAIDA' && quantidade > produtoAtual.quantidade){
   alert(`Estoque insuficiente! Disponível: ${produtoAtual.quantidade}`);
   return;
 }

 const response =
 await fetch(
 'http://localhost:3000/produtos/movimentar',
 {
  method:'POST',

  headers:{
   'Content-Type':'application/json',
   authorization:token
  },

  body:JSON.stringify({
   produto_id: produtoId,
   tipo,
   quantidade
  })

 });

 const data = await response.json();

 if(!response.ok){
   alert('Erro: ' + data.msg);
   return;
 }

 alert(data.msg);
 
 document.getElementById('produto').value = '';
 document.getElementById('quantidade').value = '';
 document.getElementById('tipo').value = 'ENTRADA';
 document.getElementById('info-produto').style.display = 'none';
 produtoAtual = null;

}

function logout(){
  localStorage.removeItem('token');
  window.location = 'login.html';
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
